    <line x1="494.37" y1="96.00" x2="534.21" y2="119.00" />
    <!-- 4 doppi legami coniugati alternati all-trans -->
    <line x1="177.34" y1="104.12" x2="207.65" y2="121.62" />
    <line x1="257.01" y1="104.12" x2="287.32" y2="121.62" />
